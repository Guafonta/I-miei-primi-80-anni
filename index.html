<style>
:root{--blue:#073f72;--blue2:#176ca8;--orange:#f2a000;--green:#35a345;--red:#e93126;--ink:#13243a;--light:#f6fbfe;--line:#d9e1e7;--shadow:0 12px 28px rgba(13,45,76,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eaf3f8;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button{font:inherit}
.phone{width:min(100%,470px);min-height:100dvh;margin:auto;background:#fff;box-shadow:0 0 28px rgba(0,0,0,.12);position:relative;overflow:hidden}
.screen{display:none;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(#fff,#fbfdff)}
.screen.active{display:flex;flex-direction:column;animation:in .18s ease}@keyframes in{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:none}}
.top{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;min-height:48px}.top-title{text-align:center;font-weight:800;color:var(--orange);font-size:16px}.back,.menu{border:0;background:transparent;color:var(--blue);font-size:30px;cursor:pointer;padding:6px}.menu{font-size:22px}
.progress{height:7px;border-radius:99px;background:#e2e5e8;overflow:hidden;margin:2px 0 34px}.progress span{display:block;height:100%;width:8%;border-radius:99px;background:var(--orange);transition:width .25s}
.btn{width:100%;border:0;border-radius:10px;padding:15px 18px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 5px 12px rgba(4,61,112,.2)}.btn-primary{background:linear-gradient(#0d5d9b,#063f72);color:white}.btn-green{background:linear-gradient(#43ad46,#248638);color:#fff}.btn-blue{background:linear-gradient(#3a91cc,#2476b2);color:#fff}.btn:disabled{opacity:.45}
/* HOME */
#home{padding:0;background:#eef8fd}.cover{min-height:100dvh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 26px calc(28px + env(safe-area-inset-bottom));overflow:hidden}.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(#e9f7ff 0 48%,#f7fbfd 48%)}
.cover-title{position:absolute;z-index:3;top:12%;left:22px;right:22px;text-align:center;color:var(--blue);font-size:clamp(38px,11vw,55px);font-weight:900;line-height:.98;letter-spacing:-1.8px}.cover-title small{display:block;font-size:15px;letter-spacing:.3px;margin-top:13px}.scene{position:absolute;z-index:1;left:0;right:0;bottom:128px;width:100%;height:58%}.cover-actions{position:relative;z-index:4;display:grid;gap:11px}

#levels .top-title{color:var(--blue)}.level-list{display:grid;gap:20px;margin-top:28px}.level{border:1px solid;border-radius:11px;padding:15px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;text-align:left;cursor:pointer;background:#fff}.level .n{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:29px;font-weight:900}.level strong{display:block;font-size:18px;margin-bottom:4px}.level em{font-style:normal;font-weight:700}.level small{display:block;margin-top:4px;font-size:14px}.l1{background:#f2faef;border-color:#a7d095}.l1 .n{background:#42a542}.l1 strong{color:#2e8e34}.l2{background:#fff8e9;border-color:#ffc76b}.l2 .n{background:#f5a000}.l2 strong{color:#e88d00}.l3{background:#fff1ef;border-color:#ffaaa2}.l3 .n{background:#e7352a}.l3 strong{color:#de2b22}
/* QUIZ */
.question{font-weight:800;text-align:center;font-size:clamp(21px,6vw,28px);line-height:1.28;margin:0 5px 28px}.answers{display:grid;gap:13px}.answer{border:2px solid #2b79bc;border-radius:10px;background:#fafdff;padding:13px 12px;display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:center;text-align:left;font-size:17px;cursor:pointer;color:var(--ink)}.answer .letter{width:25px;height:25px;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}.answer.selected{border-color:var(--orange);background:#fff8e8;box-shadow:0 0 0 3px rgba(242,160,0,.12)}.answer.correct{border-color:var(--green);background:#eff9ef}.answer.wrong{border-color:var(--red);background:#fff0ef}.grow{flex:1;min-height:25px}
/* RESULTS */
.result-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.result-icon{width:89px;height:89px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:62px;font-weight:900}.result-title{font-size:29px;margin:22px 0 30px}.result-box{width:100%;border:1px solid;border-radius:10px;padding:18px 14px;display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center;text-align:left;font-size:19px;font-weight:750;line-height:1.35}.speaker{border:0;background:transparent;font-size:30px;cursor:pointer}.ok .result-icon{background:var(--green)}.ok .result-title{color:var(--green)}.ok .result-box{background:#f0f8ed;border-color:#acd39c}.bad .result-icon{background:var(--red)}.bad .result-title{color:var(--red)}.bad .result-box{background:#fff0ef;border-color:#f4aaa5}
/* POPUP */
.drawer{display:none;position:absolute;right:15px;top:61px;z-index:20;background:white;border-radius:10px;padding:7px;box-shadow:var(--shadow)}.drawer.open{display:grid}.drawer button{border:0;background:#fff;color:var(--blue);padding:11px 13px;text-align:left;font-weight:700;cursor:pointer}.drawer button:hover{background:#eef6fb}
.modal{display:none;position:fixed;inset:0;background:rgba(0,22,43,.66);z-index:30;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{background:white;border-radius:16px;width:min(100%,360px);padding:22px;text-align:center;box-shadow:var(--shadow)}#qrcode{display:flex;justify-content:center;margin:16px}.note{font-size:13px;color:#617286;line-height:1.4}
@media(max-height:680px){.cover-title{top:7%;font-size:39px}.scene{height:54%;bottom:110px}.level-list{gap:12px;margin-top:12px}.level{padding:10px}.progress{margin-bottom:20px}.question{margin-bottom:18px}}

const QUESTIONS=[{"id":"q2","level":1,"question":"In quale luogo della capitale si combatté per difenderla dai tedeschi il 9 e 10 settembre 1943?","correct":"A Porta San Paolo","wrong":["Ai Fori Imperiali","Al Gianicolo"]},{"id":"q3","level":1,"question":"Chi collaborò con i partigiani nella liberazione del Nord Italia?","correct":"Alleati","wrong":["Spagna","Partigiani Yugoslavi"]},{"id":"q4","level":1,"question":"Da quale schieramento internazionale furono sostenute le forze che liberarono l’Italia?","correct":"Alleati","wrong":["Asse","Patto di Varsavia"]},{"id":"q5","level":1,"question":"In quale area geografica avvenne l’Eccidio di Marzabotto?","correct":"Appennino emiliano","wrong":["Alpi occidentali","Toscana"]},{"id":"q6","level":1,"question":"Quale fu uno dei rischi principali per i partigiani?","correct":"Arresto e fucilazione","wrong":["Deportazione nelle colonie italiane in Africa.","Privazione del diritto al voto"]},{"id":"q7","level":1,"question":"Quale attività era tipica dei GAP nelle città occupate?","correct":"Attentati mirati e sabotaggi urbani","wrong":["Battaglie in montagna","Occupazione villaggi isolati"]},{"id":"q8","level":1,"question":"Quale attentato compiuto dai GAP a Roma precedette l’eccidio delle Fosse Ardeatine?","correct":"Attentato di via Rasella","wrong":["L’attentato di piazza Venezia contro un comando fascista.","L’attentato contro il comando tedesco di via Tasso"]},{"id":"q9","level":1,"question":"Quale azione provocò la rappresaglia delle Fosse Ardeatine?","correct":"Attentato di via Rasella","wrong":["Battaglia di Montecassino","Uccisione di un gerarca fascista"]},{"id":"q10","level":1,"question":"Quale campo di sterminio fu destinazione di molti ebrei deportati da Roma?","correct":"Auschwitz","wrong":["Dachau","Buchenwald"]},{"id":"q11","level":1,"question":"In quale stagione del 1944 avvenne la strage di Monte Sole-Marzabotto?","correct":"Autunno","wrong":["Primavera","Estate"]},{"id":"q12","level":1,"question":"Tra Bologna, Milano e Torino, quale città venne liberata per prima?","correct":"Bologna","wrong":["Milano","Torino"]},{"id":"q13","level":1,"question":"Quale tra questi fu un eccidio nazista?","correct":"Boves","wrong":["Caporetto","Montecassino"]},{"id":"q14","level":1,"question":"Quale elenco comprende soltanto formazioni appartenenti alla Resistenza italiana?","correct":"Brigate Garibaldi, Giustizia e Libertà, Brigate Matteotti, Fiamme Verdi","wrong":["GNR e Xª MAS","Alpini, Bersaglieri, Carabinieri"]},{"id":"q15","level":1,"question":"Quale fu il destino di molti ebrei deportati?","correct":"Campi di sterminio","wrong":["Campi agricoli","Colonie"]},{"id":"q16","level":1,"question":"Contro chi si abbatté soprattutto la strage di Sant’Anna di Stazzema?","correct":"Civili","wrong":["Ufficiali italiani che avevano rifiutato di collaborare con i tedeschi.","Partigiani armati"]},{"id":"q17","level":1,"question":"Quale organismo politico riuniva e coordinava i partiti antifascisti?","correct":"CLN","wrong":["Il Comitato di Difesa della Repubblica","Il Consiglio Militare Antifascista"]},{"id":"q18","level":1,"question":"Quale organizzazione coordinava la Resistenza?","correct":"CLN","wrong":["ONU","NATO"]},{"id":"q19","level":1,"question":"Gli scioperi del marzo 1944 furono importanti perché?","correct":"Coinvolsero migliaia di operai contro il regime","wrong":["Furono organizzati dai militari","Segnarono la fine della guerra"]},{"id":"q20","level":1,"question":"Quale definizione descrive correttamente i partigiani italiani?","correct":"Combattenti contro nazifascismo","wrong":["Civili organizzati per proteggere le fabbriche dai bombardamenti.","Organizzazione politica"]},{"id":"q21","level":1,"question":"Che cosa era il CLN?","correct":"Comitato formato dai principali partiti antifascisti","wrong":["Un organismo alleato che amministrava direttamente le città liberate","Un reparto speciale dell’esercito italiano"]},{"id":"q22","level":1,"question":"Quale tipo di obiettivi venivano colpiti dai partigiani?","correct":"Convogli e infrastrutture","wrong":["Ospedali civili","Banche"]},{"id":"q23","level":1,"question":"Quale compito politico svolgeva il Comitato di Liberazione Nazionale?","correct":"Coordinare la Resistenza","wrong":["Gestire le ferrovie","Disorientare le truppe tedesche"]},{"id":"q24","level":1,"question":"In quale località del lago di Como i partigiani fermarono Mussolini?","correct":"Dongo","wrong":["Menaggio","Cernobbio"]},{"id":"q25","level":1,"question":"Quale tipo di repressione attuarono i nazisti?","correct":"Eccidi e deportazioni","wrong":["Arresti temporanei, senza condanne","Controlli economici e requisizioni di prodotti agricoli"]},{"id":"q26","level":1,"question":"Come si definivano le Brigate Garibaldi?","correct":"Formazioni partigiane","wrong":["Formazioni partigiane di orientamento monarchico","Unità coordinate dal re d'Italia"]},{"id":"q27","level":1,"question":"Quale evento tra questi fu una rappresaglia diretta?","correct":"Fosse Ardeatine","wrong":["Sbarco in Sicilia","La proclamazione della Repubblica Sociale Italiana"]},{"id":"q28","level":1,"question":"Quale episodio dell’aprile 1945 simboleggiò la definitiva caduta di Mussolini e del fascismo?","correct":"Fucilazione di Mussolini","wrong":["Armistizio","Sbarco in Sicilia"]},{"id":"q29","level":1,"question":"Che cosa avvenne nelle fabbriche del Nord Italia tra il 1º e l’8 marzo 1944?","correct":"Grandi scioperi contro la guerra e l’occupazione","wrong":["Le fabbriche furono chiuse per ordine del governo fascista.","Gli operai protestarono contro la mancanza di materie prime."]},{"id":"q30","level":1,"question":"Quale tipo di guerra fu quella partigiana?","correct":"Guerriglia","wrong":["Guerra di trincea","Fronte di guerra"]},{"id":"q31","level":1,"question":"Quale famiglia contadina antifascista fu fucilata a Reggio Emilia nel dicembre 1943?","correct":"I sette fratelli Cervi e Quarto Camurri","wrong":["I membri del CLN di Milano","I comandanti della Brigata Osoppo"]},{"id":"q32","level":1,"question":"Chi occupò militarmente il Nord Italia dopo l'armistizio?","correct":"I tedeschi","wrong":["Gli americani","Gli alleati angloamericani"]},{"id":"q33","level":1,"question":"Come si chiamava l’organismo antifascista nato a Roma il giorno successivo all’armistizio?","correct":"Il Comitato di Liberazione Nazionale","wrong":["Il Corpo Volontari della Libertà","La Repubblica Sociale Italiana"]},{"id":"q34","level":1,"question":"Come si chiamava il comando militare che unificò le formazioni partigiane nel giugno 1944?","correct":"Il Corpo Volontari della Libertà","wrong":["Il Comitato di Liberazione Nazionale","Esercito Nazionale di Liberazione."]},{"id":"q35","level":1,"question":"Qual era uno degli obiettivi strategici dei partigiani?","correct":"Indebolire i rifornimenti tedeschi","wrong":["Conquistare Roma","Difendere i confini"]},{"id":"q36","level":1,"question":"Che cosa proclamò il CLNAI il 25 aprile 1945","correct":"Insurrezione generale","wrong":["Armistizio","Trattato pace internazionale"]},{"id":"q37","level":1,"question":"Qual era il principale obiettivo dei sabotaggi ferroviari?","correct":"Interrompere i rifornimenti tedeschi","wrong":["Trasportare armi agli Alleati","Gestire le reti ferroviarie"]},{"id":"q38","level":1,"question":"Quale provvedimento antiebraico emanò la RSI alla fine di novembre 1943?","correct":"L’arresto e l’internamento degli ebrei","wrong":["Un decreto che vietava agli ebrei di trasferirsi nelle regioni del Nord Italia","Un provvedimento che obbligava gli ebrei a prestare servizio nell’esercito repubblichino"]},{"id":"q39","level":1,"question":"Quale attacco dei GAP contro un reparto tedesco ebbe luogo a Roma?","correct":"L’attentato di via Rasella","wrong":["L’insurrezione di Porta San Paolo","La liberazione del carcere di Regina Coeli"]},{"id":"q40","level":1,"question":"Quale battaglia urbana avvenne a Bologna il 7 novembre 1944?","correct":"La battaglia di Porta Lame","wrong":["La batta const rewards=["Risposta esatta, tira un altro dado!","Risposta esatta, avanza di 5 caselle!"];const penalties=["Risposta errata, retrocedi di 5 caselle.","Risposta errata, stai fermo un turno."];
let level=+(localStorage.getItem('cdl_last_level')||1),current,shown=[],selected=-1,lastMessage='',voiceOn=localStorage.getItem('cdl_voice')!=='off';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$('#drawer').classList.remove('open');scrollTo(0,0)}
function queueKey(){return 'cdl_queue_v3_'+level}function getQueue(){let q;try{q=JSON.parse(localStorage.getItem(queueKey())||'null')}catch(e){}const ids=QUESTIONS.filter(x=>x.level===level).map(x=>x.id),valid=new Set(ids);if(!Array.isArray(q)||!q.length||q.some(x=>!valid.has(x))){q=shuffle(ids.slice());localStorage.setItem(queueKey(),JSON.stringify(q))}return q}function save(q){localStorage.setItem(queueKey(),JSON.stringify(q))}
function progress(){let rem=getQueue().length,total=COUNTS[level],done=total-rem,p=Math.max(4,done/total*100);$('#quizProgress').style.width=p+'%';$$('.resultProgress').forEach(x=>x.style.width=p+'%')}
function next(){let q=getQueue(),id=q.shift();save(q);current=QUESTIONS.find(x=>x.id===id);shown=shuffle([{text:current.correct,correct:true},...current.wrong.map(text=>({text,correct:false}))]);selected=-1;$$('.levelName').forEach(x=>x.textContent='LIVELLO '+level);$('#question').textContent=current.question;$('#answers').innerHTML='';shown.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${'ABC'[i]}</span><span></span>`;b.lastElementChild.textContent=a.text;b.onclick=()=>select(i);$('#answers').appendChild(b)});$('#submit').disabled=true;progress();show('quiz')}
function select(i){selected=i;$$('.answer').forEach((b,n)=>b.classList.toggle('selected',n===i));$('#submit').disabled=false}
function tone(ok){try{let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?720:185,c.currentTime);o.frequency.exponentialRampToValueAtTime(ok?1150:95,c.currentTime+(ok?.22:.42));g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(ok?.34:.55));o.start();o.stop(c.currentTime+(ok?.36:.57))}catch(e){}}
function voice(){let v=speechSynthesis.getVoices();return v.find(x=>/it/i.test(x.lang)&&/female|elsa|alice|federica|lucia|isabella|google italiano/i.test(x.name))||v.find(x=>/it/i.test(x.lang))}
function speak(t){lastMessage=t;if(!voiceOn||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.93;u.pitch=1.08;let v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}
function submit(){if(selected<0)return;let ok=shown[selected].correct;$$('.answer').forEach((b,i)=>{b.disabled=true;if(shown[i].correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});let msg=(ok?rewards:penalties)[Math.floor(Math.random()*2)];$(ok?'#correctMsg':'#wrongMsg').textContent=msg;tone(ok);setTimeout(()=>{progress();show(ok?'correct':'wrong');speak(msg)},360)}
$('#choose').onclick=()=>show('levels');$('#resume').onclick=()=>next();$$('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;localStorage.setItem('cdl_last_level',level);next()});$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$('#submit').onclick=submit;$$('.next').forEach(b=>b.onclick=next);$$('.menu').forEach(b=>b.onclick=()=>$('#drawer').classList.toggle('open'));$$('.speaker').forEach(b=>b.onclick=()=>speak(lastMessage));$('#voice').onclick=()=>{voiceOn=!voiceOn;localStorage.setItem('cdl_voice',voiceOn?'on':'off');$('#voice').textContent=voiceOn?'🔊 Voce attiva':'🔇 Voce disattivata'};$('#voice').textContent=voiceOn?'🔊 Voce attiva':'🔇 Voce disattivata';$('#restart').onclick=()=>{localStorage.removeItem(queueKey());next()};$('#qr').onclick=()=>{$('#modal').classList.add('open');$('#qrcode').innerHTML='';let u=location.href.split('#')[0];if(location.protocol==='file:'){$('#qrnote').textContent='Il QR code definitivo comparirà dopo la pubblicazione online.'}else{$('#qrnote').textContent=u;if(window.QRCode)new QRCode($('#qrcode'),{text:u,width:210,height:210,colorDark:'#073f72',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H})}};$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
</script></body></html>
