*{box-sizing:border-box}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,var(--red),var(--orange));color:#fff;text-decoration:none;font-weight:800;font-size:1.08rem;padding:17px 24px;border-radius:14px;box-shadow:0 8px 22px rgba(211,23,36,.24);transition:.15s transform,.15s box-shadow;border:0;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(211,23,36,.3)}
.note{font-size:.88rem;line-height:1.45;color:#746b66;margin:18px 0 0}
@media (max-width:760px){body{padding:12px;align-items:flex-start}.card{grid-template-columns:1fr;border-radius:16px}.cover{max-height:52vh;object-fit:contain;background:#111}.content{padding:28px 24px 32px}h1{font-size:2.35rem}.sub{font-size:1.08rem;margin-bottom:24px}}
</style>
